name: kualiti
description: "Kualiti - Your Cozy Personal Dashboard"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ">=0.19.0 <0.21.0"
  provider: ^6.1.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  flutter_local_notifications: ^17.2.1+2
  timezone: ^0.9.4
  flutter_timezone: ^2.0.1
  flutter_foreground_task: ^6.1.1
  http: ^1.2.1
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/kualiti_logo.jpg
    - assets/audio/kualiti_notification.mp3
