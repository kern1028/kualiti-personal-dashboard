name: kualiti
description: "Kualiti - Your Cozy Personal Dashboard"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  provider: any
  sqflite: any
  path: any
  shared_preferences: any
  url_launcher: any
  flutter_local_notifications: any
  timezone: any
  flutter_timezone: ^5.1.1
  flutter_foreground_task: any
  http: any
  package_info_plus: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true

  assets:
    - assets/images/kualiti_logo.png
    - assets/images/kualiti_logo.jpg
    - assets/audio/kualiti_notification.mp3
    - assets/l10n/app_id.arb
    - assets/l10n/app_en.arb
